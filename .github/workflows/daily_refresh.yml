name: Daily Price + Score Refresh

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 4:30pm IST weekdays
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch prices
        run: python -m backend.data.fetch_prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run scorer
        run: python -m backend.analysis.scorer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
