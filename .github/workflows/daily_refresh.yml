name: Daily Price + Score Refresh

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug env
        run: python -c "import os; url = os.getenv('DATABASE_URL', 'NOT SET'); print('DB URL prefix:', url[:30] if url != 'NOT SET' else 'NOT SET')"

      - name: Fetch prices
        run: python -m backend.data.fetch_prices

      - name: Run scorer
        run: python -m backend.analysis.scorer
